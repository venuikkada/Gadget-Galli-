# Supabase CLI config for Gadget Galli (local development with `supabase start`).
project_id = "gadget-galli"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["gadgetgalli://", "http://localhost:5173", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Admins sign in with email + password (accounts are created by a super admin, not by sign-up)
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

# Customers and shop owners sign in with phone number + OTP
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "{{ .Code }} is your Gadget Galli login code. Do not share it with anyone."
max_frequency = "30s"

# Demo numbers (seed.sql) log in with OTP 123456 without sending an SMS
