# Real SMS: enable one provider (Twilio, Textlocal for India, Vonage or MessageBird) in the dashboard.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.send-push]
verify_jwt = false

[functions.order-jobs]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
